name: CI

on:
  workflow_dispatch:
    inputs:
      url_dm1q:
        description: 'S23 SamFW Direct Download Link'
        required: true
      url_dm2q:
        description: 'S23+ SamFW Direct Download Link'
        required: true
      url_dm3q:
        description: 'S23U SamFW Direct Download Link'
        required: true
      triplet_dm1q:
        description: 'Downloaded firmware triplet'
        required: true
        default: "S911BXXS9EZCI/S911BOXM9EZCI/S911BXXS9EZCI"
      triplet_dm2q:
        description: 'Downloaded firmware triplet'
        required: true
        default: "S916BXXS9EZCI/S916BOXM9EZCI/S916BXXS9EZCI"
      triplet_dm3q:
        description: 'Downloaded firmware triplet'
        required: true
        default: "S918BXXS9EZCI/S918BOXM9EZCI/S918BXXS9EZCI"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          CODE=0
          while IFS= read -r f; do
            shellcheck -e SC1090,SC1091 -s bash "$f" || CODE=1
          done < <(find platform scripts target unica -name "*.sh" -not -name "*ssi.sh" -not -name "config.sh" -not -name "sff.sh")
          exit $CODE

  generate-matrix:
    name: Generate matrix
    needs: shellcheck
    runs-on: ubuntu-24.04

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate CI matrix
        id: generate-matrix
        run: |
          matrix="$(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: [shellcheck, generate-matrix]
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev wget \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          echo -n "${{ secrets.OTA_KEY_PK8 }}" | base64 --decode > security/unica_ota.pk8
          echo -n "${{ secrets.OTA_KEY_PEM }}" | base64 --decode > security/unica_ota.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          if [[ "${{ matrix.target }}" == "dm1q" ]]; then
            {
            echo "MODEL=SM-S911B"
            echo "TRIPLET=${{ github.event.inputs.triplet_dm1q }}"
            echo "TARGET_URL=${{ github.event.inputs.url_dm1q }}"
            } >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == "dm2q" ]]; then
            {
            echo "MODEL=SM-S916B"
            echo "TRIPLET=${{ github.event.inputs.triplet_dm2q }}"
            echo "TARGET_URL=${{ github.event.inputs.url_dm2q }}"
            } >> "$GITHUB_ENV"
          elif [[ "${{ matrix.target }}" == "dm3q" ]]; then
            {
            echo "MODEL=SM-S918B"
            echo "TRIPLET=${{ github.event.inputs.triplet_dm3q }}"
            echo "TARGET_URL=${{ github.event.inputs.url_dm3q }}"
            } >> "$GITHUB_ENV"
          fi
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh
        
      - name: Download target firmware
        run: |
          echo "- Processing ${MODEL} firmware with EUX CSC"
          echo "    - Downloading firmware..."
          mkdir -p "./out/odin/${MODEL}_EUX"
          wget -q --no-check-certificate --content-disposition "${TARGET_URL}" --directory-prefix="./out/odin/${MODEL}_EUX"
          touch "./out/odin/${MODEL}_EUX/.downloaded"
          echo "${TRIPLET}" >> "./out/odin/${MODEL}_EUX/.downloaded"
          ZIP_FILE="$(find "out/odin/${MODEL}_EUX" -name "*.zip" | sort -r | head -n 1)"
          echo "- Extracting $(basename "$ZIP_FILE")..."
          unzip -o "$ZIP_FILE" -d "out/odin/${MODEL}_EUX" >/dev/null 2>&1 && rm -rf "$ZIP_FILE"

      - name: Download source firmware
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh --ignore-target

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          ./scripts/make_rom.sh -z

      - name: Upload to GoFile
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name "*sign.zip" | head -n 1)
          RESPONSE=$(curl -s -F "file=@$ZIP_FILE" -F "token=${{ secrets.GOFILE_TOKEN }}" -F "folderId=${{ secrets.GOFILE_FOLDER }}" "https://upload-eu-par.gofile.io/uploadFile")
          echo "Download link:"
          echo "$RESPONSE" | jq -r '.data.downloadPage'
